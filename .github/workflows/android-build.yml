name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # setup-gradle enables dependency + configuration caching automatically,
      # which makes repeat builds much faster than a cold compile each time.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-read-only: false

      # Signing keys are injected from GitHub Secrets — never committed.
      # RELEASE_KEYSTORE holds the base64-encoded release.p12, password in
      # RELEASE_KEYSTORE_PASSWORD. Debug uses the standard debug keystore,
      # generated here if missing.
      - name: Inject release keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          mkdir -p keystore
          echo "$RELEASE_KEYSTORE" | base64 -d > keystore/release.p12
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          fi
          ls -la keystore/ ~/.android/

      - name: Build APKs (debug + release)
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: gradle assembleDebug assembleRelease --no-daemon --parallel

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --parallel

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hyper-scope-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk

      - name: Release APK (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          APK=app/build/outputs/apk/release/app-release.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" --title "HyperScope $TAG" "$APK"
          fi

      # Keep the newest APK on the latest tagged release; the download link
      # stays current after every push (not only at tag time).
      - name: Refresh release APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          # Resolve the newest tag; refresh only a real version tag, not "latest".
          LATEST_TAG=$(gh release list --limit 20 --json tagName --jq '[.[].tagName | select(startswith("v"))][0]' 2>/dev/null || true)
          if [ -n "$LATEST_TAG" ] && gh release view "$LATEST_TAG" >/dev/null 2>&1; then
            gh release upload "$LATEST_TAG" "$APK" --clobber
          fi
