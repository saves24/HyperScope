name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      # Build the bundled ICMP ping binary with the NDK toolchain. It is a
      # small static ELF that the app copies to its files dir and executes;
      # rebuilding on every CI run keeps it in sync with the source.
      - name: Set up NDK
        uses: android-actions/setup-ndk@v2
        id: ndk
        with:
          ndk-version: r27c

      - name: Build native ping
        run: |
          NDK_TOOLCHAIN="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
          "$NDK_TOOLCHAIN/bin/aarch64-linux-android21-clang" -O2 \
            -o app/src/main/assets/ping native/ping.c
          file app/src/main/assets/ping
          ls -la app/src/main/assets/ping

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # setup-gradle enables dependency + configuration caching automatically,
      # which makes repeat builds much faster than a cold compile each time.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-read-only: false

      # Signing keys are injected from GitHub Secrets — never committed.
      # RELEASE_KEYSTORE holds the base64-encoded release.p12, password in
      # RELEASE_KEYSTORE_PASSWORD. Debug uses the standard debug keystore,
      # generated here if missing.
      - name: Inject release keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          mkdir -p keystore
          echo "$RELEASE_KEYSTORE" | base64 -d > keystore/release.p12
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          fi
          ls -la keystore/ ~/.android/

      - name: Build APKs (debug + release)
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: gradle assembleDebug assembleRelease --no-daemon --parallel

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --parallel

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hyper-scope-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk

      - name: Release APK (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          APK=app/build/outputs/apk/release/app-release.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" --title "HyperScope $TAG" "$APK"
          fi
